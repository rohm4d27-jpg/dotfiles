source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

# ── Frosted wallpaper background ──
background {
    monitor =
    path = ~/.config/omarchy/current/background
    blur_passes = 5
    blur_size = 7
    brightness = 0.55
    contrast = 0.85
    vibrancy = 0.15
    vibrancy_darkness = 0.0
}

# ── Large clock (macOS Sonoma style) ──
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M")</b>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = Inter Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── Date below clock ──
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +"%A, %B %-d")</b>"
    color = rgba(255, 255, 255, 0.72)
    font_size = 22
    font_family = Inter
    position = 0, 68
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)
}

# ── Rounded pill password field ──
input-field {
    monitor =
    size = 380, 52
    position = 0, -80
    halign = center
    valign = center

    inner_color = rgba(255, 255, 255, 0.08)
    outer_color = rgba(255, 255, 255, 0.22)
    outline_thickness = 1

    font_family = Inter
    font_color = rgba(255, 255, 255, 0.90)
    font_size = 15

    placeholder_text = <i>Enter Password</i>
    check_color = rgba(90, 210, 110, 0.85)
    fail_color = rgba(210, 65, 65, 0.85)
    fail_text = <i>Incorrect ($ATTEMPTS)</i>

    rounding = 999
    shadow_passes = 4
    shadow_size = 16
    shadow_color = rgba(0, 0, 0, 0.45)

    fade_on_empty = true
    fade_timeout = 2500

    dots_size = 0.28
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1
}

# ── Smooth fade-in animations ──
animations {
    enabled = true
    animation = global, 1, 8, linear
    animation = fadeIn, 1, 6, linear
    animation = fadeOut, 1, 6, linear
    animation = inputFieldDots, 1, 5, linear
}
