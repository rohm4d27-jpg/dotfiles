source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

# ── Background ─────────────────────────────────────────────────
background {
    monitor =
    path = /home/rohmad/Pictures/wallpapers/pexels-jacobmooreimages-34140530.jpg
    blur_passes = 3
    blur_size = 7
    vibrancy = 0.18
    brightness = 0.75
    contrast = 0.95
}

# ── Time — split into three labels for alignment ───────────────
label {
    monitor =
    text = cmd[update:1000] date +'%H'
    color = rgba(255, 255, 255, 1.0)
    font_size = 180
    font_family = Nunito Black
    position = -200, 280
    halign = center
    valign = center
}

label {
    monitor =
    text = :
    color = rgba(255, 255, 255, 1.0)
    font_size = 180
    font_family = Nunito Black
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%M'
    color = rgba(255, 255, 255, 1.0)
    font_size = 180
    font_family = Nunito Black
    position = 200, 280
    halign = center
    valign = center
}

# ── Date — below the time ──────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d'
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = Inter
    position = 0, 175
    halign = center
    valign = center
}

# ── Giraffe emoji above password field ────────────────────────
label {
    monitor =
    text = 👽
    color = rgba(255, 255, 255, 0.55)
    font_size = 20
    font_family = Noto Color Emoji
    position = 0, 95
    halign = center
    valign = bottom
}

# ── Password field — glass card ─────────────────────────────────
input-field {
    monitor =
    size = 352, 52
    position = 0, 34
    halign = center
    valign = bottom

    inner_color = rgba(30, 55, 80, 0.35)
    outer_color = rgba(140, 200, 255, 0.45)
    outline_thickness = 1

    font_family = Inter
    font_color = rgba(255, 255, 255, 1.0)

    placeholder_text = <i>Enter Password</i>
    check_color = rgba(140, 220, 255, 0.92)
    fail_color = rgba(200, 55, 55, 0.88)
    fail_text = <i>Incorrect ($ATTEMPTS)</i>

    rounding = 999
    shadow_passes = 4
    shadow_size = 18
    shadow_color = rgba(0, 0, 0, 0.45)

    fade_on_empty = true
    fade_timeout = 2500

    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
}

animations {
    enabled = true
    animation = global, 1, 4, linear
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 1, linear
}
