# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Turn on keyboard backlight at session start (Dell driver can boot with it off).
exec-once = brightnessctl -d dell::kbd_backlight set 100%

# Kill mako (started by omarchy defaults) and use swaync instead.
# mako is launched late by uwsm-app (~2s after session start), so wait for it,
# then keep killing until it stays dead, then start swaync as the only daemon.
exec-once = bash -c 'sleep 3; for i in 1 2 3 4 5 6 7 8; do pkill -x mako 2>/dev/null; sleep 0.5; pgrep -x mako >/dev/null || break; done; while true; do swaync; sleep 1; done'
