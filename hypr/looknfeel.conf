# Glassmorphism look'n'feel — blue/teal frosted glass

$glassBorder = rgb(6fb3e0)

general {
    # No gaps between windows or borders
     gaps_in = 2
     gaps_out = 2
     border_size = 2
     col.active_border = $glassBorder
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 20
       blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        contrast = 1.0
        brightness = 1.20
        vibrancy = 0.22
        }
    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(00000072)
    }
    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}
# All windows: active 0.78 / inactive 0.68 — see-through enough that the
# blurred (bright) backdrop lightens the app instead of a near-opaque dark panel
windowrule = opacity 0.78 0.68, match:class .*

# Layer surfaces: blur only where the surface is tightly sized to its
# visible content. waybar reserves the full bar width, and swaync uses ONE
# ~500x846 surface (namespace "swaync-notification-window") for BOTH toast
# popups AND the control-center panel — confirmed via `hyprctl layers`, so
# there's no separate "swaync-control-center" namespace to target. Blurring
# either of those tints/blurs the whole empty reserve — keep those CSS-glass
# only. walker/swayosd surfaces are tightly fit (confirmed via `hyprctl
# layers` too), so blur is safe there — the rectangular box seen earlier
# was CSS box-shadow getting clipped by the surface edge, not blur bleed.
layerrule = blur off, match:namespace waybar
layerrule = blur off, match:namespace swaync-notification-window
layerrule = blur on, match:namespace walker
layerrule = blur on, match:namespace swayosd
# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
     enabled = yes
    animation = windows,1,7,default
    animation = fade,1,7,default
    animation = workspaces,1,6,default
    animation = layers,1,3,default,slide

}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}

