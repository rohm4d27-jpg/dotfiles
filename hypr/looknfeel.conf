# Glassmorphism look'n'feel — white frosted glass

$glassBorder = rgb(ffffff)

general {
    # No gaps between windows or borders
     gaps_in = 2
     gaps_out = 2
     border_size = 2
     col.active_border = $glassBorder
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 20
       blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        contrast = 1.0
        brightness = 1.20
        vibrancy = 0.22
        }
    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(00000072)
    }
    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}
# All windows: active 0.78 / inactive 0.68 — see-through enough that the
# blurred (bright) backdrop lightens the app instead of a near-opaque dark panel
windowrule = opacity 0.78 0.68, match:class .*

# Layer surfaces (waybar, walker, swaync toasts, swaync control-center) all
# reserve more surface than their visible pill/card — e.g. walker anchors
# all 4 edges to center its popup (0x0 to full monitor size), waybar's
# surface spans the full bar width but only the centered pill has a
# background, and swaync uses two separate ~500x846 surfaces confirmed via
# `hyprctl layers` ("swaync-notification-window" for toast popups,
# "swaync-control-center" for the panel) that are bigger than their visible
# card. Plain `blur on` would bleed across the whole reserved area instead
# of just the rounded shape. `ignore_alpha` fixes this properly: blur only
# samples pixels above the given opacity, so the transparent reserve around
# the popup is skipped and just the glass shape gets blurred. Threshold is
# set below all these apps' lowest CSS background alpha (~0.28-0.35) so the
# visible glass always clears it.
#
# swayosd is the one exception: its surface (confirmed via `hyprctl layers`)
# is already tightly fit to the OSD pill, so it has nothing to bleed into —
# blur stays off there and its glass look comes from CSS transparency alone.
layerrule = blur off, match:namespace swayosd
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center
layerrule = blur on, match:namespace walker
layerrule = ignore_alpha 0.1, match:namespace walker
# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
     enabled = yes
    animation = windows,1,7,default
    animation = fade,1,7,default
    animation = workspaces,1,6,default
    animation = layers,1,3,default,slide

}

# https://wiki.hypr.land/Configuring/Basics/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # See only one column per screen instead of two
    # column_width = 0.97
}

