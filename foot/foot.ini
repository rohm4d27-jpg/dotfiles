[main]
include=~/.config/omarchy/current/theme/foot.ini
term=xterm-256color
font=JetBrainsMono Nerd Font Mono:size=9
pad=14x14
initial-window-mode=windowed
workers=0

[colors]
# Below 1.0 so foot stops declaring a fully opaque surface region —
# otherwise the compositor skips blending and Hyprland's window opacity/blur
# (looknfeel.conf) has no visible effect at all.
alpha=0.90

[scrollback]
lines=10000

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert
primary-paste=none
clipboard-paste=Shift+Insert

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return
