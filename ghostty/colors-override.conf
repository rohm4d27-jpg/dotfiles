# Overrides the theme's blue-navy background with the neutral gray used by
# waybar/swaync/walker, so the terminal matches the rest of the theme.
# Transparency/blur is untouched — this file only swaps hue, not opacity.
#
# This MUST be a separate file loaded via its own config-file directive, not
# inline assignments in config: Ghostty always applies an included
# config-file's contents after the includer's own directives, regardless of
# where in the parent file the config-file line sits — so plain
# `background = ...` lines after `config-file = ...theme/ghostty.conf` still
# lose to the theme. A later config-file directive DOES win over an earlier
# one, so this file has to be pulled in via its own config-file line placed
# after the theme's.
background = #1a1a1a
foreground = #ffffff
cursor-color = #ffffff
selection-background = #292929
selection-foreground = #ffffff
